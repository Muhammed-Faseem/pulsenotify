apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: pulsenotify
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker
      containers:
        - name: worker
          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/pulsenotify/worker:latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          envFrom:
            - configMapRef:
                name: pulsenotify-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pulsenotify-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: pulsenotify-secrets
                  key: REDIS_URL
            - name: SQS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: pulsenotify-secrets
                  key: SQS_QUEUE_URL
