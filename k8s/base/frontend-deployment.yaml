apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pulsenotify
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 967283278916.dkr.ecr.ap-south-1.amazonaws.com/pulsenotify/frontend:692cce20a25419f700317edee0e71f426815065a
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: pulsenotify
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
