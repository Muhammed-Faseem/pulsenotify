apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pulsenotify-secrets
  namespace: pulsenotify
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: pulsenotify-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: pulsenotify/production/database
        property: url
    - secretKey: REDIS_URL
      remoteRef:
        key: pulsenotify/production/redis
        property: url
    - secretKey: SQS_QUEUE_URL
      remoteRef:
        key: pulsenotify/production/sqs
        property: url
