apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pulsenotify
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Muhammed-Faseem/pulsenotify.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: pulsenotify
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
